name = "astera-customer-ai-edge"
main = "src/worker.js"
compatibility_date = "2026-08-10"
workers_dev = false

[[routes]]
pattern = "api.asterav8.jp/v1/customer-ai/*"
zone_name = "asterav8.jp"

[vars]
ALLOWED_ORIGINS = "https://asterav8.jp,https://www.asterav8.jp,https://app.asterav8.jp"
MAX_INPUT_BYTES = "32768"
MAX_MESSAGE_CHARS = "12000"
RUNTIME_REQUEST_TIMEOUT_MS = "30000"
TURNSTILE_EXPECTED_ACTION = "customer_ai"
TURNSTILE_ALLOWED_HOSTNAMES = "asterav8.jp,www.asterav8.jp,app.asterav8.jp"

[[ratelimits]]
name = "CUSTOMER_AI_RATE_LIMITER"
namespace_id = "12001"

  [ratelimits.simple]
  limit = 60
  period = 60
