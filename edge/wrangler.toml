name = "astera-customer-ai-edge"
main = "src/worker.js"
compatibility_date = "2026-07-28"
workers_dev = false

[[routes]]
pattern = "https://api.asterav8.jp/v1/customer-ai/*"
zone_name = "asterav8.jp"

[secrets]
required = [
  "WEBHOOK_INTERNAL_API_URL",
  "WEBHOOK_INTERNAL_API_TOKEN",
  "RESULT_WEBHOOK_SECRET",
  "TURNSTILE_SECRET",
  "CUSTOMER_AI_EXTERNAL_API_TOKEN",
  "CUSTOMER_AI_RUNTIME_URL",
  "CUSTOMER_AI_HMAC_SECRET",
  "HF_TOKEN"
]

[vars]
ALLOWED_ORIGINS = "https://asterav8.jp,https://www.asterav8.jp,https://app.asterav8.jp"
CUSTOMER_AI_RUNTIME_DESTINATION_ID = "private-runtime"
MAX_INPUT_BYTES = "32768"
MAX_MESSAGE_CHARS = "20000"
RESULT_TTL_SECONDS = "3600"
RUNTIME_REQUEST_TIMEOUT_MS = "30000"
TURNSTILE_EXPECTED_ACTION = "customer_ai"
TURNSTILE_ALLOWED_HOSTNAMES = "asterav8.jp,www.asterav8.jp,app.asterav8.jp"

[[kv_namespaces]]
binding = "CUSTOMER_AI_RESULTS"
# Replace only with the existing production namespace ID from the Cloudflare account.
id = "replace_with_production_kv_namespace_id"

[[ratelimits]]
name = "CUSTOMER_AI_RATE_LIMITER"
namespace_id = "12001"

  [ratelimits.simple]
  limit = 60
  period = 60
