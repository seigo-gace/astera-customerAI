name: deploy-public-hf-customer-ai-facade

on:
  push:
    branches: [main]
    paths:
      - 'public_proxy.py'
      - 'scripts/provision_hf_public_proxy.py'
      - '.deploy/customer-ai-public-proxy'
      - '.github/workflows/deploy-hf-public-proxy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-public-hf-customer-ai-facade
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_KEY }}
      CUSTOMER_AI_HMAC_SECRET: ${{ secrets.CUSTOMER_AI_HMAC_SECRET }}
      HF_PRIVATE_SPACE_ID: G-ACE/astera-customerAI
      HF_PUBLIC_SPACE_ID: G-ACE/astera-customerAI-public
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - name: Verify facade deployment inputs
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN missing' >&2; exit 11; }
          test -n "$CUSTOMER_AI_HMAC_SECRET" || { echo 'CUSTOMER_AI_HMAC_SECRET missing' >&2; exit 12; }
          python -m pip install --upgrade pip --quiet
          pip install 'fastapi==0.128.2' 'uvicorn==0.48.0' 'httpx>=0.28,<1' 'huggingface_hub>=1.24.0' --quiet
          python -m py_compile public_proxy.py scripts/provision_hf_public_proxy.py
      - name: Deploy facade and run live E2E
        id: live
        shell: bash
        run: |
          set -o pipefail
          python scripts/provision_hf_public_proxy.py 2>&1 | tee /tmp/customer-ai-facade-deploy.log
      - name: Persist deployment evidence
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'status': os.environ.get('JOB_STATUS', 'unknown'),
              'preflight': os.environ.get('PREFLIGHT_OUTCOME', 'unknown'),
              'live_e2e': os.environ.get('LIVE_OUTCOME', 'unknown'),
              'architecture': 'public-hp -> GitHub-private managed facade -> private HF runtime',
              'cloudflare_customer_ai': False,
              'public_facade': 'G-ACE/astera-customerAI-public',
              'private_runtime': 'G-ACE/astera-customerAI',
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }
          Path('deployment-evidence/public-facade-latest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-evidence/public-facade-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record Customer AI facade deployment evidence"
          git push origin HEAD:main
