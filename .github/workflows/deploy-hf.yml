name: deploy-private-hf-runtime

on:
  workflow_dispatch:
    inputs:
      enable_model:
        description: Enable the free local model after deployment
        required: true
        default: '1'
        type: choice
        options: ['0', '1']
  push:
    branches: [main]
    paths:
      - '.deploy/customer-ai-free-model'

permissions:
  contents: write

concurrency:
  group: deploy-private-hf-runtime
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_KEY }}
      HF_NAMESPACE: G-ACE
      HF_SPACE_NAME: astera-customerAI
      HF_BUCKET_NAME: astera-customerai-data
      HF_COMMIT_MESSAGE: Deploy GitHub main ${{ github.sha }}
      CUSTOMER_AI_HMAC_SECRET: ${{ secrets.CUSTOMER_AI_HMAC_SECRET }}
      INTERNAL_EVENT_API_URL: ${{ secrets.INTERNAL_EVENT_API_URL }}
      INTERNAL_EVENT_API_TOKEN: ${{ secrets.INTERNAL_EVENT_API_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: d4003654-ce9a-43cb-8cb6-20401d179580
      NOTION_INDEX_DATA_SOURCE_ID: 014f4a72-e01f-41b0-9992-55be47a4aba4
      CUSTOMER_AI_MODEL_ID: Qwen/Qwen3-0.6B
      CUSTOMER_AI_MODEL_REVISION: c1899de289a04d12100db370d81485cdf75e47ca
      CUSTOMER_AI_ENABLE_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_model || '1' }}
      INTERNAL_EVENT_SOURCE_ID: hf-private-runtime
      INTERNAL_EVENT_RESULT_DESTINATION_ID: app-receiver
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Refuse non-main deployment source
        run: test "$(git branch --show-current)" = "main"

      - name: Install verification and deployment dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements-dev.txt --quiet
          pip install --upgrade 'huggingface_hub>=1.24.0' 'httpx>=0.28,<1' --quiet

      - name: Pre-deploy full verification
        run: |
          python scripts/review.py --all
          ruff check . --select E9,F63,F7,F82
          pytest -q
          npm test
          npm run check:edge
          npm run test:edge

      - name: Provision private Space and Bucket and deploy main
        run: python scripts/provision_hf.py

      - name: Synchronize completed KB and run baseline live story tests
        run: python scripts/run_live_story_suite.py

      - name: Run latest HP public AI live story tests
        run: python scripts/run_hp_public_story_suite.py

      - name: Upload live story evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-ai-live-story-${{ github.run_id }}
          path: |
            test-results/live-story-report.json
            test-results/hp-public-story-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Persist latest deployment evidence
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p deployment-evidence
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          def load_report(path: str, failure_stage: str) -> dict:
              source = Path(path)
              if source.exists():
                  report = json.loads(source.read_text(encoding='utf-8'))
              else:
                  report = {
                      'accepted': False,
                      'total': 0,
                      'passed': 0,
                      'failed': 0,
                      'score_percent': 0.0,
                      'free_model_invoked': False,
                      'failure_stage': failure_stage,
                  }
              report['workflow_status'] = os.environ['WORKFLOW_STATUS']
              report['workflow_run_id'] = os.environ['WORKFLOW_RUN_ID']
              report['workflow_sha'] = os.environ['GITHUB_SHA']
              report['evidence_persisted_at'] = datetime.now(UTC).isoformat()
              return report

          baseline = load_report(
              'test-results/live-story-report.json',
              'before_baseline_live_story_report',
          )
          hp_public = load_report(
              'test-results/hp-public-story-report.json',
              'before_hp_public_live_story_report',
          )
          Path('deployment-evidence/live-story-latest.json').write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          Path('deployment-evidence/hp-public-story-latest.json').write_text(
              json.dumps(hp_public, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-evidence/live-story-latest.json deployment-evidence/hp-public-story-latest.json
          git commit -m "chore: record latest Customer AI live verification" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deployment summary
        if: always()
        run: |
          echo '## Private HF deployment and live verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Space: G-ACE/astera-customerAI' >> "$GITHUB_STEP_SUMMARY"
          echo '- Bucket: G-ACE/astera-customerai-data' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mount: /data/customer-ai' >> "$GITHUB_STEP_SUMMARY"
          echo "- Free local model: ${CUSTOMER_AI_MODEL_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model enabled: ${CUSTOMER_AI_ENABLE_MODEL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          for label, path in (
              ('Baseline live story', 'test-results/live-story-report.json'),
              ('HP public AI live story', 'test-results/hp-public-story-report.json'),
          ):
              source = Path(path)
              if not source.exists():
                  print(f'- {label}: report missing')
                  continue
              report = json.loads(source.read_text())
              print(
                  f"- {label}: {report.get('passed', 0)}/{report.get('total', 0)} "
                  f"({report.get('score_percent', 0):.2f}%)"
              )
              print(f"  - Accepted: {report.get('accepted')}")
              print(f"  - Free model invoked: {report.get('free_model_invoked')}")
              if report.get('kb_sync'):
                  print(f"  - KB source pages: {report['kb_sync'].get('source_pages')}")
          PY
