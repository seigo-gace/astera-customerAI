name: deploy-hf

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip 'huggingface_hub>=1.24.0'
      - name: Provision private Space and bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: G-ACE
          HF_SPACE_NAME: astera-customerAI
          HF_BUCKET_NAME: astera-customerai-data
          HF_COMMIT_MESSAGE: Deploy GitHub commit ${{ github.sha }}
        run: python scripts/provision_hf.py
