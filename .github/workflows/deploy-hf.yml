name: deploy-current-hf-space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - runtime/**
      - config/**
      - requirements.txt
      - Dockerfile
      - .github/workflows/deploy-hf.yml

permissions:
  contents: write

concurrency:
  group: deploy-current-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_KEY }}
      HF_SPACE_ID: G-ACE/astera-customerAI
      HF_SPACE_URL: https://g-ace-astera-customerai.hf.space
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install verification and deploy dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --upgrade 'huggingface_hub>=1.24.0'

      - name: Verify current canonical runtime
        run: |
          python -m compileall -q app.py runtime training evaluation tests
          ruff check --select F app.py runtime training evaluation tests
          python -m pytest -q
          docker build -t astera-customerai-current .

      - name: Build clean HF Space payload
        run: |
          rm -rf hf-stage
          mkdir -p hf-stage
          cp app.py Dockerfile requirements.txt pyproject.toml .dockerignore hf-stage/
          cp -a config runtime hf-stage/
          cat > hf-stage/README.md <<'META'
          ---
          title: Astera Customer AI
          sdk: docker
          app_port: 7860
          ---
          META
          cat README.md >> hf-stage/README.md

      - name: Replace existing HF Space with current runtime only
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              raise SystemExit("HF_TOKEN_or_HF_KEY_missing")

          stage = Path("hf-stage")
          expected = {
              str(p.relative_to(stage)).replace("\\", "/")
              for p in stage.rglob("*")
              if p.is_file()
          }

          api = HfApi(token=token)
          info = api.repo_info(repo_id=os.environ["HF_SPACE_ID"], repo_type="space")
          parent = info.sha
          commit = api.upload_folder(
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              folder_path=str(stage),
              path_in_repo=".",
              delete_patterns=["*", "**/*"],
              parent_commit=parent,
              commit_message=f"Deploy current Customer AI runtime {os.environ['SOURCE_SHA']}",
          )

          remote = set(api.list_repo_files(repo_id=os.environ["HF_SPACE_ID"], repo_type="space"))
          remote.discard(".gitattributes")
          unexpected = sorted(remote - expected)
          missing = sorted(expected - remote)
          if unexpected or missing:
              raise SystemExit(f"HF_space_file_mismatch unexpected={unexpected} missing={missing}")

          Path("hf-deploy-commit.txt").write_text(str(commit.oid), encoding="utf-8")
          print(f"hf_commit={commit.oid}")
          print(f"source_sha={os.environ['SOURCE_SHA']}")
          print(f"files={len(remote)}")
          PY

      - name: Verify rebuilt Space HTTP boundary
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["HF_SPACE_URL"].rstrip("/")
          last = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=10) as r:
                      body = json.loads(r.read().decode("utf-8"))
                      last = (r.status, body)
                      if r.status == 200 and body.get("status") == "ok" and body.get("zero_gpu") is False:
                          print(json.dumps({"health": body}, ensure_ascii=False))
                          break
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as e:
                  last = repr(e)
              time.sleep(10)
          else:
              raise SystemExit(f"HF_space_health_not_ready last={last!r}")

          with urllib.request.urlopen(base + "/ready", timeout=10) as r:
              ready = json.loads(r.read().decode("utf-8"))
          if ready.get("status") != "ready" or ready.get("three_role_resident") is not True:
              raise SystemExit(f"HF_space_runtime_not_ready={ready!r}")
          print(json.dumps({"ready": ready}, ensure_ascii=False))
          PY

      - name: Verify staging browser CORS and Customer AI response
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base = os.environ["HF_SPACE_URL"].rstrip("/")
          origin = "https://staging.asterav8.jp"

          preflight = urllib.request.Request(
              base + "/respond",
              method="OPTIONS",
              headers={
                  "Origin": origin,
                  "Access-Control-Request-Method": "POST",
                  "Access-Control-Request-Headers": "content-type",
              },
          )
          with urllib.request.urlopen(preflight, timeout=15) as response:
              allow_origin = response.headers.get("Access-Control-Allow-Origin")
              if response.status != 200 or allow_origin != origin:
                  raise SystemExit(
                      f"staging_cors_failed status={response.status} allow_origin={allow_origin!r}"
                  )
              preflight_status = response.status

          payload = json.dumps({
              "message": "料金を教えて",
              "source": "astera-app",
              "locale": "ja-JP",
              "session_id": "session_staging_deploy_gate",
              "message_id": "message_staging_deploy_gate",
              "response_mode": "auto",
              "mode_source": "auto",
              "current_path": "/app/new",
          }).encode("utf-8")
          request = urllib.request.Request(
              base + "/respond",
              data=payload,
              method="POST",
              headers={
                  "Origin": origin,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              body = json.loads(response.read().decode("utf-8"))
              allow_origin = response.headers.get("Access-Control-Allow-Origin")
              answer = str(body.get("answer") or body.get("clarification") or "").strip()
              if response.status != 200 or allow_origin != origin or not answer:
                  raise SystemExit(
                      f"staging_respond_failed status={response.status} allow_origin={allow_origin!r} body={body!r}"
                  )
              respond_status = response.status

          evidence = {
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "source_sha": os.environ["SOURCE_SHA"],
              "hf_commit": Path("hf-deploy-commit.txt").read_text(encoding="utf-8").strip(),
              "space_url": base,
              "origin": origin,
              "preflight_status": preflight_status,
              "allow_origin": allow_origin,
              "respond_status": respond_status,
              "respond_has_answer": bool(answer),
              "answer_preview": answer[:160],
              "status": "success",
          }
          Path("deployment-evidence/staging-app-customer-ai-live.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False))
          PY

      - name: Commit live staging verification evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-evidence/staging-app-customer-ai-live.json
          git commit -m "Record staging Customer AI live verification for ${SOURCE_SHA}" || exit 0
          git push origin HEAD:main
