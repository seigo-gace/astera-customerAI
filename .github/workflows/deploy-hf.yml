name: deploy-private-hf-runtime

on:
  workflow_dispatch:
    inputs:
      enable_model:
        description: Enable the free local model after deployment
        required: true
        default: '1'
        type: choice
        options: ['0', '1']
  push:
    branches: [main]
    paths:
      - '.deploy/customer-ai-free-model'

permissions:
  contents: read

concurrency:
  group: deploy-private-hf-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_KEY }}
      HF_NAMESPACE: G-ACE
      HF_SPACE_NAME: astera-customerAI
      HF_BUCKET_NAME: astera-customerai-data
      HF_COMMIT_MESSAGE: Deploy GitHub main ${{ github.sha }}
      CUSTOMER_AI_HMAC_SECRET: ${{ secrets.CUSTOMER_AI_HMAC_SECRET }}
      INTERNAL_EVENT_API_URL: ${{ secrets.INTERNAL_EVENT_API_URL }}
      INTERNAL_EVENT_API_TOKEN: ${{ secrets.INTERNAL_EVENT_API_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: d4003654-ce9a-43cb-8cb6-20401d179580
      NOTION_INDEX_DATA_SOURCE_ID: 014f4a72-e01f-41b0-9992-55be47a4aba4
      CUSTOMER_AI_MODEL_ID: Qwen/Qwen3-0.6B
      CUSTOMER_AI_MODEL_REVISION: c1899de289a04d12100db370d81485cdf75e47ca
      CUSTOMER_AI_ENABLE_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_model || '1' }}
      INTERNAL_EVENT_SOURCE_ID: hf-private-runtime
      INTERNAL_EVENT_RESULT_DESTINATION_ID: app-receiver
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Refuse non-main deployment source
        run: test "$(git branch --show-current)" = "main"

      - name: Install verification and deployment dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements-dev.txt --quiet
          pip install --upgrade 'huggingface_hub>=1.24.0' 'httpx>=0.28,<1' --quiet

      - name: Pre-deploy full verification
        run: |
          python scripts/review.py --all
          ruff check . --select E9,F63,F7,F82
          pytest -q
          npm test
          npm run check:edge
          npm run test:edge

      - name: Provision private Space and Bucket and deploy main
        run: python scripts/provision_hf.py

      - name: Synchronize completed KB and run live story tests
        run: python scripts/run_live_story_suite.py

      - name: Upload live story evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-ai-live-story-${{ github.run_id }}
          path: test-results/live-story-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Deployment summary
        if: always()
        run: |
          {
            echo '## Private HF deployment and live verification'
            echo '- Space: G-ACE/astera-customerAI'
            echo '- Bucket: G-ACE/astera-customerai-data'
            echo '- Mount: /data/customer-ai'
            echo "- Free local model: ${CUSTOMER_AI_MODEL_ID}"
            echo "- Model enabled: ${CUSTOMER_AI_ENABLE_MODEL}"
            echo "- GitHub SHA: ${GITHUB_SHA}"
            if test -f test-results/live-story-report.json; then
              python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('test-results/live-story-report.json').read_text())
          print(f"- Live story: {report['passed']}/{report['total']} ({report['score_percent']:.2f}%)")
          print(f"- Free model invoked: {report['free_model_invoked']}")
          print(f"- KB source pages: {report['kb_sync']['source_pages']}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
