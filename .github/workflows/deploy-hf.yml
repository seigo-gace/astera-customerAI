name: deploy-private-hf-runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.deploy/customer-ai-free-model']

permissions:
  contents: read

concurrency:
  group: deploy-private-hf-runtime
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_KEY }}
      HF_NAMESPACE: G-ACE
      HF_SPACE_NAME: astera-customerAI
      HF_BUCKET_NAME: astera-customerai-data
      HF_COMMIT_MESSAGE: Deploy GitHub main ${{ github.sha }}
      CUSTOMER_AI_HMAC_SECRET: ${{ secrets.CUSTOMER_AI_HMAC_SECRET }}
      INTERNAL_EVENT_API_URL: ${{ secrets.INTERNAL_EVENT_API_URL }}
      INTERNAL_EVENT_API_TOKEN: ${{ secrets.INTERNAL_EVENT_API_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: e8f1bcaa-8e1f-482f-97db-f90542699e4a
      CUSTOMER_AI_KB_SCHEMA: v3
      CUSTOMER_AI_MODEL_ID: Qwen/Qwen3-0.6B
      CUSTOMER_AI_MODEL_REVISION: c1899de289a04d12100db370d81485cdf75e47ca
      CUSTOMER_AI_ENABLE_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Refuse non-main deployment source
        run: test "$(git branch --show-current)" = "main"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements-dev.txt --quiet
          pip install --upgrade 'huggingface_hub>=1.24.0' 'httpx>=0.28,<1' --quiet
      - name: Pre-deploy full verification
        run: |
          python scripts/review.py --all
          ruff check . --select E9,F63,F7,F82
          pytest -q
          npm test
      - name: Provision private HF runtime
        run: python scripts/provision_hf.py
