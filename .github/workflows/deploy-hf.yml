name: deploy-private-hf-runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hf.yml'
  workflow_dispatch:
    inputs:
      enable_model:
        description: Enable the optional lightweight model after deployment
        required: true
        default: '0'
        type: choice
        options: ['0', '1']

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-private-hf-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_NAMESPACE: G-ACE
      HF_SPACE_NAME: astera-customerAI
      HF_BUCKET_NAME: astera-customerai-data
      HF_COMMIT_MESSAGE: Deploy GitHub main ${{ github.sha }}
      CUSTOMER_AI_HMAC_SECRET: ${{ secrets.CUSTOMER_AI_HMAC_SECRET }}
      INTERNAL_EVENT_API_URL: ${{ secrets.INTERNAL_EVENT_API_URL }}
      INTERNAL_EVENT_API_TOKEN: ${{ secrets.INTERNAL_EVENT_API_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      CUSTOMER_AI_MODEL_ID: Qwen/Qwen3-4B-Instruct-2507
      CUSTOMER_AI_MODEL_REVISION: cdbee75f17c01a7cc42f958dc650907174af0554
      CUSTOMER_AI_ENABLE_MODEL: ${{ inputs.enable_model || '0' }}
      INTERNAL_EVENT_SOURCE_ID: hf-private-runtime
      INTERNAL_EVENT_RESULT_DESTINATION_ID: app-receiver
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required GitHub secret names
        env:
          ACTIONS_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          python - <<'PY'
          import json
          import os

          names = sorted(json.loads(os.environ.get("ACTIONS_SECRETS_JSON") or "{}").keys())
          print("ACTIONS_SECRET_NAMES=" + ",".join(names))
          if "HF_TOKEN" not in names:
              raise SystemExit("HF_TOKEN_SECRET_NAME_NOT_VISIBLE")
          if not os.environ.get("HF_TOKEN"):
              raise SystemExit("HF_TOKEN_SECRET_VALUE_EMPTY")
          print("HF_TOKEN_SECRET_VISIBLE")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Refuse non-main deployment source
        run: test "$(git branch --show-current)" = "main"

      - name: Install verification and deployment dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements-dev.txt --quiet
          pip install --upgrade 'huggingface_hub>=1.24.0' 'httpx>=0.28,<1' --quiet

      - name: Pre-deploy full verification
        id: verify
        run: |
          python scripts/review.py --all
          ruff check . --select E9,F63,F7,F82
          pytest -q
          npm test
          npm run check:edge
          npm run test:edge

      - name: Provision private Space and Bucket and deploy main
        id: provision
        run: python scripts/provision_hf.py

      - name: Deployment summary
        if: success()
        run: |
          {
            echo '## Private HF deployment'
            echo '- Space: G-ACE/astera-customerAI'
            echo '- Bucket: G-ACE/astera-customerai-data'
            echo '- Mount: /data/customer-ai'
            echo "- Model enabled: ${CUSTOMER_AI_ENABLE_MODEL}"
            echo "- GitHub SHA: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
        run: |
          gh issue comment 9 --body "$(cat <<EOF
          HF deployment run: ${RUN_ID}
          URL: ${RUN_URL}
          SHA: ${GITHUB_SHA}
          Job status: ${JOB_STATUS}
          Verification: ${VERIFY_OUTCOME}
          Provision: ${PROVISION_OUTCOME}
          EOF
          )"
