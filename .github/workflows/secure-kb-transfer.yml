name: customer-ai-secure-kb-transfer

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write

jobs:
  transfer:
    if: github.actor == 'seigo-gace' && github.event.issue.title == '[kb-transfer] customer-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      HF_BUCKET_ID: G-ACE/astera-customerai-kb
      HF_SPACE_ID: G-ACE/astera-customerAI
      KB_BUILD_ID: kb-20260814T042741+0900
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Generate ephemeral RSA transport key and publish public key only
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/kb-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/kb-private.pem -pubout -out /tmp/kb-public.pem >/dev/null 2>&1
          pub_b64=$(base64 -w0 /tmp/kb-public.pem)
          body=$(printf 'KB_TRANSFER_READY=1\nKB_TRANSFER_PUBLIC_KEY_B64=%s\nKB_BUILD_ID=%s' "$pub_b64" "$KB_BUILD_ID")
          python - "$body" <<'PY' >/tmp/public-key-comment.json
          import json, sys
          print(json.dumps({'body': sys.argv[1]}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/public-key-comment.json >/dev/null

      - name: Wait for encrypted transport payload
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 480))
          while (( SECONDS < deadline )); do
            git fetch origin main --quiet
            if git cat-file -e origin/main:.kb-transfer/manifest.json 2>/dev/null; then
              git checkout origin/main -- .kb-transfer
              test -s .kb-transfer/manifest.json
              echo 'KB_TRANSFER_PAYLOAD_FOUND=1'
              exit 0
            fi
            sleep 5
          done
          echo 'KB_TRANSFER_PAYLOAD_TIMEOUT' >&2
          exit 31

      - name: Decrypt and validate exact KB artifact
        id: decrypt
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade 'cryptography>=44,<47' 'huggingface_hub>=1.24,<2' 'httpx>=0.27,<1'
          python - <<'PY'
          import base64, hashlib, json, os, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = Path('.kb-transfer')
          meta = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          build_id = os.environ['KB_BUILD_ID']
          if meta.get('schema_version') != 1 or meta.get('build_id') != build_id:
              raise SystemExit('transport_manifest_identity_mismatch')
          chunks = meta.get('chunks')
          if not isinstance(chunks, list) or not chunks:
              raise SystemExit('transport_chunks_missing')
          parts = []
          for item in chunks:
              name = str(item.get('name') or '')
              expected = str(item.get('sha256') or '')
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'transport_chunk_missing={name}')
              raw = path.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected:
                  raise SystemExit(f'transport_chunk_hash_mismatch={name}')
              parts.append(raw.decode('ascii'))
          ciphertext = base64.b64decode(''.join(parts), validate=True)
          if hashlib.sha256(ciphertext).hexdigest() != meta.get('ciphertext_sha256'):
              raise SystemExit('transport_ciphertext_hash_mismatch')

          private_key = serialization.load_pem_private_key(Path('/tmp/kb-private.pem').read_bytes(), password=None)
          aes_key = private_key.decrypt(
              base64.b64decode(meta['wrapped_key_b64']),
              padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None),
          )
          nonce = base64.b64decode(meta['nonce_b64'])
          aad = str(meta['aad']).encode('utf-8')
          plaintext = AESGCM(aes_key).decrypt(nonce, ciphertext, aad)
          if hashlib.sha256(plaintext).hexdigest() != meta.get('plaintext_sha256'):
              raise SystemExit('transport_plaintext_hash_mismatch')

          zip_path = Path('/tmp/customer-ai-kb.zip')
          zip_path.write_bytes(plaintext)
          release = Path('/tmp/customer-ai-kb-release')
          release.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path) as archive:
              for info in archive.infolist():
                  target = (release / info.filename).resolve()
                  if release.resolve() not in target.parents and target != release.resolve():
                      raise SystemExit('zip_path_escape')
              archive.extractall(release)

          manifest = json.loads((release / 'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('build_id') != build_id:
              raise SystemExit('release_build_id_mismatch')
          for item in manifest.get('files', []):
              path = release / str(item['path'])
              if not path.is_file() or path.stat().st_size != int(item['bytes']):
                  raise SystemExit(f'release_file_size_mismatch={path.name}')
              if hashlib.sha256(path.read_bytes()).hexdigest() != item['sha256']:
                  raise SystemExit(f'release_file_hash_mismatch={path.name}')
          validation = json.loads((release / 'validation.json').read_text(encoding='utf-8'))
          counts = validation.get('counts') or {}
          if validation.get('passed') is not True:
              raise SystemExit('release_validation_not_passed')
          expected_counts = {'canonical_stable': 493, 'current_facts': 31, 'retrieval_documents': 524}
          for key, expected in expected_counts.items():
              if int(counts.get(key, -1)) != expected:
                  raise SystemExit(f'release_count_mismatch={key}')
          print('KB_DECRYPT_VALIDATE_OK=1')
          print('KB_BUILD_ID=' + build_id)
          print('KB_CANONICAL=493')
          print('KB_CURRENT=31')
          print('KB_RETRIEVAL=524')
          PY
          echo 'validated=1' >> "$GITHUB_OUTPUT"

      - name: Publish exact release to private HF Storage Bucket
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from huggingface_hub import HfApi, HfFileSystem, batch_bucket_files, bucket_info

          def sha(path: Path) -> str:
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          candidates=[('HF_TOKEN',os.environ.get('HF_TOKEN_PRIMARY','').strip()),('HF_KEY',os.environ.get('HF_TOKEN_FALLBACK','').strip())]
          selected=None
          for label, token in candidates:
              if not token: continue
              try:
                  who=HfApi(token=token).whoami()
              except Exception:
                  continue
              if str(who.get('name') or '') == 'G-ACE':
                  selected=(label,token)
          if selected is None:
              raise SystemExit('no_gace_hf_token')
          label, token=selected
          print('::add-mask::'+token)
          bucket_id=os.environ['HF_BUCKET_ID']
          build_id=os.environ['KB_BUILD_ID']
          if not bucket_info(bucket_id, token=token).private:
              raise SystemExit('bucket_not_private')
          release=Path('/tmp/customer-ai-kb-release')
          original_manifest=json.loads((release/'manifest.json').read_text(encoding='utf-8'))
          release_root=f'releases/{build_id}'
          fs=HfFileSystem(token=token)
          local_files=sorted(p for p in release.iterdir() if p.is_file())
          manifest_uri=f'hf://buckets/{bucket_id}/{release_root}/manifest.json'
          if fs.exists(manifest_uri):
              with fs.open(manifest_uri,'rb') as f:
                  remote_manifest_bytes=f.read()
              if hashlib.sha256(remote_manifest_bytes).hexdigest()!=sha(release/'manifest.json'):
                  raise SystemExit('release_build_id_conflict')
              for p in local_files:
                  uri=f'hf://buckets/{bucket_id}/{release_root}/{p.name}'
                  if not fs.exists(uri):
                      raise SystemExit(f'existing_release_incomplete={p.name}')
                  h=hashlib.sha256()
                  with fs.open(uri,'rb') as f:
                      for chunk in iter(lambda:f.read(1024*1024), b''):
                          h.update(chunk)
                  if h.hexdigest()!=sha(p):
                      raise SystemExit(f'existing_release_hash_mismatch={p.name}')
          else:
              batch_bucket_files(bucket_id, add=[(p, f'{release_root}/{p.name}') for p in local_files], token=token)

          for p in local_files:
              uri=f'hf://buckets/{bucket_id}/{release_root}/{p.name}'
              if not fs.exists(uri):
                  raise SystemExit(f'bucket_readback_missing={p.name}')
              h=hashlib.sha256()
              with fs.open(uri,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              if h.hexdigest()!=sha(p):
                  raise SystemExit(f'bucket_readback_hash_mismatch={p.name}')

          active={
              'schema_version':1,
              'build_id':build_id,
              'canonical_path':f'{release_root}/canonical_stable.jsonl',
              'current_facts_path':f'{release_root}/current_facts.jsonl',
              'aliases_path':None,
              'manifest_path':f'{release_root}/manifest.json',
          }
          active_bytes=(json.dumps(active,ensure_ascii=False,indent=2)+'\n').encode('utf-8')
          batch_bucket_files(bucket_id, add=[(active_bytes,'active.json')], token=token)
          with fs.open(f'hf://buckets/{bucket_id}/active.json','r',encoding='utf-8') as f:
              remote_active=json.load(f)
          if remote_active != active:
              raise SystemExit('active_pointer_readback_mismatch')

          evidence={
              'status':'success','hf_auth_selected':label,'bucket_id':bucket_id,'private':True,
              'build_id':build_id,'release_files':len(local_files),'active_pointer':'active.json',
              'canonical_path':active['canonical_path'],'current_facts_path':active['current_facts_path'],
              'source_manifest_sha256':sha(release/'manifest.json'),
          }
          Path('/tmp/hf-publish-evidence.json').write_text(json.dumps(evidence),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('HF_TOKEN='+token+'\n')
          print(json.dumps(evidence,ensure_ascii=False))
          PY
          echo 'published=1' >> "$GITHUB_OUTPUT"

      - name: Deploy current main to existing HF Space with read-only Bucket mount
        id: deploy
        shell: bash
        env:
          CUSTOMER_AI_KB_BUILD_ID: kb-20260814T042741+0900
          CUSTOMER_AI_KB_BUCKET_ID: G-ACE/astera-customerai-kb
          CUSTOMER_AI_KB_MOUNT_PATH: /data/customer-ai
          CUSTOMER_AI_KB_ACTIVE_POINTER: active.json
        run: |
          set -euo pipefail
          python scripts/deploy_hf_direct.py --repo-root . 2>&1 | tee /tmp/deploy.log
          echo 'deployed=1' >> "$GITHUB_OUTPUT"

      - name: Report safe transfer result
        if: always()
        shell: bash
        env:
          VALIDATED: ${{ steps.decrypt.outputs.validated }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          publish_summary=''
          if test -s /tmp/hf-publish-evidence.json; then
            publish_summary=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/hf-publish-evidence.json',encoding='utf-8'))
          print(f"BUCKET={d.get('bucket_id')}\nBUILD={d.get('build_id')}\nRELEASE_FILES={d.get('release_files')}\nACTIVE={d.get('active_pointer')}\nSOURCE_MANIFEST_SHA256={d.get('source_manifest_sha256')}")
          PY
            )
          fi
          body=$(printf 'KB_TRANSFER_STATUS=%s\nVALIDATED=%s\nPUBLISHED=%s\nDEPLOYED=%s\n%s' "$JOB_STATUS" "${VALIDATED:-0}" "${PUBLISHED:-0}" "${DEPLOYED:-0}" "$publish_summary")
          python - "$body" <<'PY' >/tmp/result-comment.json
          import json, sys
          print(json.dumps({'body': sys.argv[1]}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/result-comment.json >/dev/null
