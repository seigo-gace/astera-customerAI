name: Deploy Customer AI Edge

on:
  push:
    branches: [main]
    paths:
      - 'edge/**'
      - '.github/workflows/deploy-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-ai-production-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUSTOMER_AI_API_BASE: https://api.asterav8.jp/v1/customer-ai
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CUSTOMER_AI_EXTERNAL_API_TOKEN: ${{ secrets.CUSTOMER_AI_EXTERNAL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Verify synchronous edge before deploy
        shell: bash
        run: |
          set -euo pipefail
          npm run check:edge
          npm run test:edge
          grep -Fq "'/v1/customer-ai/respond'" edge/src/worker.js
          grep -Fq "'/v1/customer-ai/config'" edge/src/worker.js
          grep -Fq "'/v1/customer-ai/healthz'" edge/src/worker.js
          grep -Fq "'/v1/customer-ai/sessions/'" edge/src/worker.js
          ! grep -Fq '/v1/customer-ai/jobs/' edge/src/worker.js

      - name: Require Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing' >&2; exit 1; }

      - name: Deploy production Customer AI Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge
          wranglerVersion: '4'
          command: deploy

      - name: Probe production Edge contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$CUSTOMER_AI_API_BASE/healthz?probe=${GITHUB_SHA}" -o /tmp/customer-ai-health.json \
              && curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$CUSTOMER_AI_API_BASE/config?probe=${GITHUB_SHA}" -o /tmp/customer-ai-config.json; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/customer-ai-health.json').read_text())
          config = json.loads(Path('/tmp/customer-ai-config.json').read_text())
          assert health.get('ok') is True, health
          assert health.get('service') == 'customer-ai-edge', health
          assert health.get('runtime_configured') is True, health
          assert isinstance(config.get('turnstile_site_key'), str) and config['turnstile_site_key'].strip(), config
          PY
              then
                break
              fi
            fi
            if [ "$attempt" -eq 24 ]; then
              echo 'Production Customer AI Edge did not become ready with runtime + Turnstile configuration.' >&2
              cat /tmp/customer-ai-health.json 2>/dev/null || true
              cat /tmp/customer-ai-config.json 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

      - name: Authenticated synchronous answer smoke when token is available
        if: ${{ env.CUSTOMER_AI_EXTERNAL_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          payload=$(python3 - <<PY
          import json
          print(json.dumps({
            'message': 'Asteraについて一文で案内してください',
            'source': 'astera-hp',
            'locale': 'ja-JP',
            'session_id': 'session_deploy_${suffix}',
            'message_id': 'message_deploy_${suffix}',
            'response_mode': 'general',
            'mode_source': 'selected',
            'current_path': '/ja/'
          }, ensure_ascii=False))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CUSTOMER_AI_EXTERNAL_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$CUSTOMER_AI_API_BASE/respond" -o /tmp/customer-ai-answer.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/customer-ai-answer.json').read_text())
          assert result.get('ok') is True, result
          assert str(result.get('answer') or result.get('clarification') or '').strip(), result
          assert result.get('status') in {'completed', 'awaiting_clarification', 'degraded'}, result
          PY

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Customer AI Production Edge'
            echo "- GitHub SHA: ${GITHUB_SHA}"
            echo '- Route: api.asterav8.jp/v1/customer-ai/*'
            echo '- Normal browser path: synchronous /respond; no job polling'
            echo "- Authenticated answer smoke configured: ${{ env.CUSTOMER_AI_EXTERNAL_API_TOKEN != '' }}"
          } >> "$GITHUB_STEP_SUMMARY"
