name: Deploy Customer AI Edge

on:
  push:
    branches: [main]
    paths:
      - 'edge/**'
      - '.github/workflows/deploy-edge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customer-ai-production-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUSTOMER_AI_API_BASE: https://api.asterav8.jp/v1/customer-ai
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CUSTOMER_AI_EXTERNAL_API_TOKEN: ${{ secrets.CUSTOMER_AI_EXTERNAL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Verify synchronous edge before deploy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          npm run check:edge
          npm run test:edge
          grep -Fq "'/v1/customer-ai/respond'" edge/src/worker.js
          grep -Fq "'/v1/customer-ai/config'" edge/src/worker.js
          grep -Fq "'/v1/customer-ai/healthz'" edge/src/worker.js
          grep -Fq "'/v1/customer-ai/sessions/'" edge/src/worker.js
          ! grep -Fq '/v1/customer-ai/jobs/' edge/src/worker.js

      - name: Require Cloudflare deploy credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing' >&2; exit 1; }

      - name: Deploy production Customer AI Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge
          wranglerVersion: '4'
          command: deploy

      - name: Probe production Edge contract
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$CUSTOMER_AI_API_BASE/healthz?probe=${GITHUB_SHA}" -o /tmp/customer-ai-health.json \
              && curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$CUSTOMER_AI_API_BASE/config?probe=${GITHUB_SHA}" -o /tmp/customer-ai-config.json; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/customer-ai-health.json').read_text())
          config = json.loads(Path('/tmp/customer-ai-config.json').read_text())
          assert health.get('ok') is True, health
          assert health.get('service') == 'customer-ai-edge', health
          assert health.get('runtime_configured') is True, health
          assert isinstance(config.get('turnstile_site_key'), str) and config['turnstile_site_key'].strip(), config
          PY
              then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production Customer AI Edge did not become ready with runtime + Turnstile configuration.' >&2
          cat /tmp/customer-ai-health.json 2>/dev/null || true
          cat /tmp/customer-ai-config.json 2>/dev/null || true
          exit 1

      - name: Authenticated synchronous answer smoke when token is available
        id: answer
        if: ${{ env.CUSTOMER_AI_EXTERNAL_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          payload=$(python3 - <<PY
          import json
          print(json.dumps({
            'message': 'Asteraについて一文で案内してください',
            'source': 'astera-hp',
            'locale': 'ja-JP',
            'session_id': 'session_deploy_${suffix}',
            'message_id': 'message_deploy_${suffix}',
            'response_mode': 'general',
            'mode_source': 'selected',
            'current_path': '/ja/'
          }, ensure_ascii=False))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CUSTOMER_AI_EXTERNAL_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$CUSTOMER_AI_API_BASE/respond" -o /tmp/customer-ai-answer.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/customer-ai-answer.json').read_text())
          assert result.get('ok') is True, result
          assert str(result.get('answer') or result.get('clarification') or '').strip(), result
          assert result.get('status') in {'completed', 'awaiting_clarification', 'degraded'}, result
          PY

      - name: Record deployment evidence
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          ANSWER_OUTCOME: ${{ steps.answer.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          evidence = {
              'source_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'recorded_at': datetime.now(UTC).isoformat(),
              'verify': os.environ.get('VERIFY_OUTCOME', 'unknown'),
              'credentials': os.environ.get('CREDENTIALS_OUTCOME', 'unknown'),
              'deploy': os.environ.get('DEPLOY_OUTCOME', 'unknown'),
              'production_probe': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'authenticated_answer_smoke': os.environ.get('ANSWER_OUTCOME', 'skipped'),
              'job_status': os.environ.get('JOB_STATUS', 'unknown'),
              'api_base': 'https://api.asterav8.jp/v1/customer-ai',
              'normal_path': 'synchronous_respond_no_job_polling',
          }
          Path('deployment-evidence/customer-ai-edge-latest.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-evidence/customer-ai-edge-latest.json
          git commit -m 'chore: record Customer AI edge deployment evidence' || exit 0
          git push origin HEAD:main

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Customer AI Production Edge'
            echo "- GitHub SHA: ${GITHUB_SHA}"
            echo '- Route: api.asterav8.jp/v1/customer-ai/*'
            echo '- Normal browser path: synchronous /respond; no job polling'
            echo "- Verify: ${{ steps.verify.outcome }}"
            echo "- Credentials: ${{ steps.credentials.outcome }}"
            echo "- Deploy: ${{ steps.deploy.outcome }}"
            echo "- Production probe: ${{ steps.probe.outcome }}"
            echo "- Authenticated answer smoke: ${{ steps.answer.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
