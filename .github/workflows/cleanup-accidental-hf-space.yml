name: cleanup-accidental-hf-space

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-accidental-hf-space.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-accidental-hf-space
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      TARGET_SPACE: G-ACE/astera-customerAI-public
      KEEP_SPACE: G-ACE/astera-customerAI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Delete only accidental Space and verify absence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          pip install 'huggingface_hub>=1.24.0' --quiet
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          from huggingface_hub.errors import RepositoryNotFoundError

          target = os.environ['TARGET_SPACE'].strip()
          keep = os.environ['KEEP_SPACE'].strip()
          if target != 'G-ACE/astera-customerAI-public':
              raise SystemExit('TARGET_GUARD_FAILED')
          if target == keep:
              raise SystemExit('KEEP_SPACE_GUARD_FAILED')

          selected = None
          diagnostics = []
          for label, token in [
              ('HF_TOKEN', os.environ.get('HF_TOKEN_PRIMARY', '').strip()),
              ('HF_KEY', os.environ.get('HF_TOKEN_FALLBACK', '').strip()),
          ]:
              if not token:
                  diagnostics.append(f'{label}:missing')
                  continue
              try:
                  info = HfApi(token=token).whoami()
              except Exception as error:
                  diagnostics.append(f'{label}:auth_error:{type(error).__name__}')
                  continue
              name = str(info.get('name') or '')
              is_pro = bool(info.get('isPro'))
              diagnostics.append(f'{label}:name={name}:isPro={is_pro}')
              if name == 'G-ACE':
                  selected = (label, token, is_pro)
                  break

          for line in diagnostics:
              print('HF_AUTH_DIAGNOSTIC=' + line)
          if selected is None:
              raise SystemExit('NO_G_ACE_HF_TOKEN_AVAILABLE')

          label, token, is_pro = selected
          print('::add-mask::' + token)
          api = HfApi(token=token)

          existed_before = True
          try:
              info = api.space_info(target)
              print('TARGET_SPACE_FOUND=' + str(getattr(info, 'id', target)))
          except RepositoryNotFoundError:
              existed_before = False
              print('TARGET_SPACE_ALREADY_ABSENT=true')

          if existed_before:
              api.delete_repo(repo_id=target, repo_type='space')
              print('TARGET_SPACE_DELETE_REQUESTED=true')

          deleted = False
          try:
              api.space_info(target)
          except RepositoryNotFoundError:
              deleted = True

          if not deleted:
              raise SystemExit('TARGET_SPACE_STILL_EXISTS')

          Path('deployment-evidence').mkdir(exist_ok=True)
          Path('deployment-evidence/hf-space-cleanup-latest.json').write_text(
              json.dumps({
                  'status': 'deleted' if existed_before else 'already_absent',
                  'target_space': target,
                  'preserved_space': keep,
                  'authenticated_account': 'G-ACE',
                  'is_pro': is_pro,
                  'token_source': label,
                  'verified_absent_after': True,
                  'run_id': os.environ.get('GITHUB_RUN_ID', ''),
                  'source_sha': os.environ.get('GITHUB_SHA', ''),
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('HF_SPACE_CLEANUP_OK=true')
          PY
      - name: Persist evidence and remove one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-evidence/hf-space-cleanup-latest.json
          git rm .github/workflows/cleanup-accidental-hf-space.yml
          git commit -m 'chore: record accidental HF Space cleanup evidence'
          git push origin HEAD:main
