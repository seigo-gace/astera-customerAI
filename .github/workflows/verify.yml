name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: python -m pip install --upgrade pip --quiet
      - run: pip install -r requirements-dev.txt --quiet
      - name: Review architecture and syntax
        run: python scripts/review.py --all
      - name: Ruff fatal checks
        if: always()
        run: ruff check . --select E9,F63,F7,F82
      - name: Conversation and control runtime tests
        if: always()
        run: pytest -q tests/test_control_core.py
      - name: Support blueprint preparation test
        if: always()
        run: pytest -q tests/test_support_runtime.py::test_support_runtime_prepares_analysis_search_evidence_and_blueprint
      - name: Support missing-evidence test
        if: always()
        run: pytest -q tests/test_support_runtime.py::test_missing_evidence_creates_specific_unresolved_section
      - name: Support task-coverage validation test
        if: always()
        run: pytest -q tests/test_support_runtime.py::test_validation_requires_every_task_to_be_answered_or_unresolved
      - name: Support feedback privacy and dedupe test
        if: always()
        run: pytest -q tests/test_support_runtime.py::test_feedback_store_anonymizes_and_deduplicates
      - name: API and service integration tests
        if: always()
        run: pytest -q tests/test_api.py tests/test_service.py
      - name: KB security and storage tests
        if: always()
        run: pytest -q tests/test_kb.py tests/test_security.py tests/test_storage.py
      - name: V8 follow-up analysis test
        if: always()
        run: node --test --test-name-pattern="follow-up analysis" v8/test/server.test.mjs
      - name: V8 document decomposition test
        if: always()
        run: node --test --test-name-pattern="document analysis" v8/test/server.test.mjs
      - name: V8 new-topic test
        if: always()
        run: node --test --test-name-pattern="new explicit topic" v8/test/server.test.mjs
      - name: V8 coverage validation test
        if: always()
        run: node --test --test-name-pattern="missing coverage" v8/test/server.test.mjs
      - name: V8 security validation test
        if: always()
        run: node --test --test-name-pattern="topic drift" v8/test/server.test.mjs
