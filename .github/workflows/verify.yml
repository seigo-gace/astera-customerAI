name: verify

on:
  push:
    paths-ignore:
      - 'deployment-evidence/**'
  pull_request:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: python -m pip install --upgrade pip --quiet
      - run: pip install -r requirements-dev.txt --quiet
      - run: mkdir -p test-results
      - name: Review architecture and syntax
        run: python scripts/review.py --all
      - name: Ruff fatal checks
        if: always()
        run: ruff check . --select E9,F63,F7,F82
      - name: HF API client static boundary
        if: always()
        run: |
          python -m py_compile runtime/model.py hp_runtime.py
          grep -Fq 'https://router.huggingface.co/v1/chat/completions' runtime/model.py
          grep -Fq 'HF_TOKEN' runtime/model.py
          grep -Fq '@app.post("/respond")' hp_runtime.py
          grep -Fq '@app.delete("/sessions/{session_id}")' hp_runtime.py
          grep -Fq 'MAX_PUBLIC_MESSAGE_CHARS = 12_000' hp_runtime.py
          ! grep -Eq 'AutoModelForCausalLM|AutoTokenizer|import torch|from transformers' runtime/model.py
          ! grep -Eqi 'cloudflare|turnstile|api\.asterav8\.jp|hf\.space' runtime/model.py hp_runtime.py
      - name: HF API client unit tests
        if: always()
        run: pytest -q tests/test_model_api.py --junitxml=test-results/model-api.xml
      - name: HP runtime contract tests
        if: always()
        run: pytest -q tests/test_hp_runtime.py --junitxml=test-results/hp-runtime.xml
      - name: Live HF API smoke from private GitHub workflow
        id: hf_smoke
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_KEY }}
          CUSTOMER_AI_HF_TIMEOUT_SECONDS: '30'
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN missing'; exit 11; }
          python - <<'PY'
          from runtime.model import _generate_remote
          answer = _generate_remote(
              'Qwen/Qwen3-0.6B',
              '{"deterministic_answer":"OK とだけ返してください。"}',
              8,
          ).strip()
          if not answer:
              raise SystemExit('HF_API_SMOKE_EMPTY')
          print('HF_API_SMOKE_OK')
          PY
      - name: Persist HF API smoke evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HF_SMOKE_OUTCOME: ${{ steps.hf_smoke.outcome }}
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'hf_api_smoke': os.environ.get('HF_SMOKE_OUTCOME', 'unknown'),
              'execution': 'private GitHub workflow -> Hugging Face Inference API',
              'model': 'Qwen/Qwen3-0.6B',
              'token_exposed': False,
              'cloudflare_customer_ai': False,
              'public_hf_space': False,
              'hp_runtime_source': 'hp_runtime.py',
          }
          Path('deployment-evidence/hf-api-smoke.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-evidence/hf-api-smoke.json
          git commit -m 'chore: record HF API smoke evidence [skip ci]' || exit 0
          git push origin HEAD:main
      - name: Conversation and control runtime tests
        if: always()
        run: pytest -q tests/test_control_core.py --junitxml=test-results/control.xml
      - name: Support preparation feedback and validation tests
        if: always()
        run: pytest -q tests/test_support_runtime.py --junitxml=test-results/support.xml
      - name: API and service integration tests
        if: always()
        run: pytest -q tests/test_api.py tests/test_service.py tests/test_public_routing.py --junitxml=test-results/api-service.xml
      - name: KB v3 adapter and 100-scenario regression
        if: always()
        run: pytest -q tests/test_notion_v3.py tests/test_kb_v3_story_matrix_100.py --junitxml=test-results/kb-v3.xml
      - name: KB security and storage tests
        if: always()
        run: pytest -q tests/test_kb.py tests/test_security.py tests/test_storage.py --junitxml=test-results/kb-security-storage.xml
      - name: Story tests repeated three times
        if: always()
        run: |
          set -euo pipefail
          for run in 1 2 3; do pytest -q tests/test_story_runtime.py --basetemp=".pytest-story-$run" --junitxml="test-results/story-$run.xml"; done
      - name: Signed operational runtime tests repeated twice
        if: always()
        run: |
          set -euo pipefail
          for run in 1 2; do pytest -q tests/test_operational_runtime.py --basetemp=".pytest-operational-$run" --junitxml="test-results/operational-$run.xml"; done
      - name: V8 runtime tests
        if: always()
        run: npm test
      - name: Full Python regression suite
        if: always()
        run: pytest -q --junitxml=test-results/full-regression.xml
      - name: Enforce HF API smoke result
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HF_SMOKE_OUTCOME: ${{ steps.hf_smoke.outcome }}
        run: test "$HF_SMOKE_OUTCOME" = 'success'
      - name: Upload verification results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: customer-ai-verification-${{ github.run_id }}
          path: test-results
          if-no-files-found: error
          retention-days: 7
