name: verify
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app.py runtime training evaluation tests
      - name: Ruff fatal/static errors
        run: ruff check --select F app.py runtime training evaluation tests
      - name: Pytest
        run: python -m pytest -q
      - name: Legacy runtime boundary
        run: |
          test ! -e runtime/kb.py
          test ! -e runtime/notion.py
          test ! -e runtime/notion_v3.py
          test ! -e runtime/bundled_snapshot.py
          test ! -e hp_runtime.py
          test ! -e public_app.py
          test ! -d edge
          test ! -d kb
          test ! -d v8
