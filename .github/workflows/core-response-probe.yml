name: customer-ai-core-response-probe

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.actor == 'seigo-gace' && github.event.issue.title == '[core-probe] customer-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      SPACE_URL: https://g-ace-astera-customerai.hf.space
    steps:
      - name: Probe internal FinalResponse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/probe.txt
          import json, os, urllib.request
          base=os.environ['SPACE_URL'].rstrip('/')
          payload=json.dumps({'session_id':'session_core_probe','message':'Asteraとは何ですか？'},ensure_ascii=False).encode('utf-8')
          req=urllib.request.Request(base+'/v1/customer-ai/messages',data=payload,method='POST',headers={'Content-Type':'application/json','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=90) as r:
                  print('STATUS='+str(r.status))
                  print('BODY='+r.read().decode('utf-8','replace')[:50000])
          except Exception as exc:
              print('ERROR='+type(exc).__name__+':'+str(exc))
              if hasattr(exc,'read'):
                  try: print('ERROR_BODY='+exc.read().decode('utf-8','replace')[:50000])
                  except Exception: pass
          PY
      - name: Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/result.json
          import json
          try: text=open('/tmp/probe.txt',encoding='utf-8',errors='replace').read()
          except Exception as exc: text='PROBE_MISSING='+type(exc).__name__
          print(json.dumps({'body':'CORE_RESPONSE_PROBE\n```\n'+text[:60000]+'\n```'}))
          PY
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --data-binary @/tmp/result.json >/dev/null
