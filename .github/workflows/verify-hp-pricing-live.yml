name: verify-hp-pricing-live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-hp-pricing-live.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify exact live pricing response
        shell: bash
        run: |
          set -euo pipefail
          pip install 'httpx>=0.28,<1' --quiet
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import httpx

          hp = 'https://asterav8.jp'
          endpoint = 'https://g-ace-astera-customerai.hf.space'
          stamp = str(int(time.time()))
          payload = {
              'session_id': 'session_pricing_e2e_' + stamp,
              'message_id': 'message_pricing_e2e_' + stamp,
              'message': '料金を教えて',
              'locale': 'ja-JP',
              'source': 'astera-hp',
              'response_mode': 'billing',
              'mode_source': 'selected',
              'current_path': '/ja/',
          }
          result = {
              'hp': hp,
              'endpoint': endpoint,
              'question': payload['message'],
              'page_status': 0,
              'client_status': 0,
              'client_has_existing_endpoint': False,
              'respond_status': 0,
              'respond_has_answer': False,
              'answer_has_basic_980': False,
              'answer_has_pro_2980': False,
              'answer_has_business_9980': False,
              'answer_has_enterprise_29800': False,
              'generic_fallback': False,
              'answer': '',
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'source_sha': os.environ.get('GITHUB_SHA', ''),
          }
          with httpx.Client(timeout=90, follow_redirects=True, headers={'user-agent':'Astera-HP-Pricing-E2E/1.0'}) as client:
              page = client.get(hp + '/ja/?_pricing_e2e=' + stamp)
              result['page_status'] = page.status_code
              asset = client.get(hp + '/scripts/ai-hf-chat.js?_pricing_e2e=' + stamp)
              result['client_status'] = asset.status_code
              result['client_has_existing_endpoint'] = endpoint in asset.text
              response = client.post(endpoint + '/respond', json=payload, headers={'origin': hp, 'content-type': 'application/json'})
              result['respond_status'] = response.status_code
              if response.status_code == 200:
                  body = response.json()
                  answer = str(body.get('answer') or body.get('clarification') or '').strip()
                  result['answer'] = answer
                  result['respond_has_answer'] = bool(answer)
                  compact = answer.replace(',', '').replace('，','')
                  result['answer_has_basic_980'] = '980円' in answer or '980' in compact
                  result['answer_has_pro_2980'] = '2,980円' in answer or '2980' in compact
                  result['answer_has_business_9980'] = '9,980円' in answer or '9980' in compact
                  result['answer_has_enterprise_29800'] = '29,800円' in answer or '29800' in compact
                  result['generic_fallback'] = '該当する正確な案内情報が登録されていません' in answer
                  client.delete(endpoint + '/sessions/' + payload['session_id'], headers={'origin': hp})
          Path('deployment-evidence').mkdir(exist_ok=True)
          Path('deployment-evidence/hp-live-pricing-e2e.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('HP_LIVE_PRICING_E2E=' + json.dumps(result, ensure_ascii=False))
          ok = all([
              result['page_status'] == 200,
              result['client_status'] == 200,
              result['client_has_existing_endpoint'],
              result['respond_status'] == 200,
              result['respond_has_answer'],
              result['answer_has_basic_980'],
              result['answer_has_pro_2980'],
              result['answer_has_business_9980'],
              result['answer_has_enterprise_29800'],
              not result['generic_fallback'],
          ])
          if not ok:
              raise SystemExit('HP_LIVE_PRICING_E2E_FAILED')
          PY
      - name: Persist exact E2E and remove one-time workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -f deployment-evidence/hp-live-pricing-e2e.json ]; then git add deployment-evidence/hp-live-pricing-e2e.json; fi
          git rm .github/workflows/verify-hp-pricing-live.yml
          git commit -m 'test: record live HP pricing E2E evidence'
          git push origin HEAD:main
