name: customer-ai-public-kb-locate

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write

jobs:
  locate:
    if: github.actor == 'seigo-gace' && github.event.issue.title == '[kb-public-locate] customer-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install tooling
        run: python -m pip install --quiet --upgrade 'huggingface_hub>=1.24,<2'

      - name: Locate uploaded KB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/locate.txt
          import os
          from huggingface_hub import HfApi, list_buckets, list_bucket_tree

          selected = None
          for label, key in (("HF_TOKEN", "HF_TOKEN_PRIMARY"), ("HF_KEY", "HF_TOKEN_FALLBACK")):
              token = os.environ.get(key, "").strip()
              if not token:
                  continue
              try:
                  who = HfApi(token=token).whoami()
              except Exception:
                  continue
              if str(who.get("name") or "") == "G-ACE":
                  selected = (label, token)
          if selected is None:
              print('ERROR=no_gace_hf_token')
              raise SystemExit(1)
          label, token = selected
          print('HF_AUTH=' + label)

          seen = set()
          for namespace in (None, 'G-ACE', 'G-ACEinc'):
              tag = namespace or '<self>'
              print('NAMESPACE=' + tag)
              try:
                  buckets = list(list_buckets(namespace=namespace, token=token))
              except Exception as exc:
                  print(f'  LIST_ERROR={type(exc).__name__}:{exc}')
                  continue
              if not buckets:
                  print('  NO_BUCKETS')
              for b in buckets:
                  if b.id in seen:
                      continue
                  seen.add(b.id)
                  print(f'  BUCKET={b.id} PRIVATE={bool(b.private)} FILES={getattr(b,"total_files",None)} SIZE={getattr(b,"size",None)}')
                  if bool(b.private):
                      continue
                  try:
                      tree = list(list_bucket_tree(b.id, token=token))
                      for item in tree[:40]:
                          print('    PATH=' + str(item.path))
                  except Exception as exc:
                      print(f'    TREE_ERROR={type(exc).__name__}:{exc}')

          api = HfApi(token=token)
          print('SPACE=G-ACE/astera-customerAI')
          try:
              files = api.list_repo_files(repo_id='G-ACE/astera-customerAI', repo_type='space')
              for path in files[:100]:
                  print('  SPACE_PATH=' + str(path))
          except Exception as exc:
              print(f'  SPACE_ERROR={type(exc).__name__}:{exc}')
          PY

      - name: Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/result.json
          import json
          text=''
          try:
              text=open('/tmp/locate.txt',encoding='utf-8',errors='replace').read()
          except Exception as exc:
              text='LOCATE_OUTPUT_MISSING=' + type(exc).__name__
          print(json.dumps({'body':'PUBLIC_KB_LOCATE\n```\n'+text[:60000]+'\n```'}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/result.json >/dev/null
