name: customer-ai-hf-role-model-probe

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.actor == 'seigo-gace' && github.event.issue.title == '[hf-role-probe] customer-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install probe deps
        run: python -m pip install --quiet --upgrade 'httpx>=0.28,<1' 'huggingface_hub>=1.24,<2'
      - name: Probe models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/probe.txt
          import asyncio, json, os
          import httpx
          from huggingface_hub import HfApi

          selected=None
          for label,key in (("HF_TOKEN","HF_TOKEN_PRIMARY"),("HF_KEY","HF_TOKEN_FALLBACK")):
              token=os.environ.get(key,"").strip()
              if not token: continue
              try: who=HfApi(token=token).whoami()
              except Exception: continue
              if str(who.get('name') or '')=='G-ACE': selected=(label,token)
          if selected is None: raise SystemExit('no_gace_hf_token')
          label,token=selected
          print('AUTH='+label)
          url='https://router.huggingface.co/v1/chat/completions'
          async def one(model,response_format):
              payload={'model':model,'messages':[{'role':'user','content':'Return JSON: {"ok":true}'}],'stream':False,'temperature':0.1,'max_tokens':120}
              if response_format:
                  payload['response_format']={'type':'json_object'}
              async with httpx.AsyncClient(timeout=60) as client:
                  r=await client.post(url,headers={'authorization':'Bearer '+token},json=payload)
                  print(f'MODEL={model} RESPONSE_FORMAT={response_format} STATUS={r.status_code}')
                  print('BODY='+r.text[:12000])
          async def main():
              for model in ('Qwen/Qwen3-4B','Qwen/Qwen3-8B'):
                  for rf in (True,False):
                      try: await one(model,rf)
                      except Exception as exc: print(f'MODEL={model} RESPONSE_FORMAT={rf} EXCEPTION={type(exc).__name__}:{exc}')
          asyncio.run(main())
          PY
      - name: Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/result.json
          import json
          try: text=open('/tmp/probe.txt',encoding='utf-8',errors='replace').read()
          except Exception as exc: text='PROBE_MISSING='+type(exc).__name__
          print(json.dumps({'body':'HF_ROLE_MODEL_PROBE\n```\n'+text[:60000]+'\n```'}))
          PY
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --data-binary @/tmp/result.json >/dev/null
