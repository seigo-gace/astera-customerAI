name: repair-existing-hf-space

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-existing-hf-space.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-public-hf-customer-ai
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      HF_PUBLIC_SPACE_ID: G-ACE/astera-customerAI
      CUSTOMER_AI_MODEL_ID: Qwen/Qwen3-0.6B
      CUSTOMER_AI_MODEL_REVISION: c1899de289a04d12100db370d81485cdf75e47ca
      CUSTOMER_AI_ENABLE_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve G-ACE HF token
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          pip install 'huggingface_hub>=1.24.0' --quiet
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          for label, token in [
              ('HF_TOKEN', os.environ.get('HF_TOKEN_PRIMARY', '').strip()),
              ('HF_KEY', os.environ.get('HF_TOKEN_FALLBACK', '').strip()),
          ]:
              if not token:
                  continue
              try:
                  info = HfApi(token=token).whoami()
              except Exception:
                  continue
              if str(info.get('name') or '') == 'G-ACE':
                  print('::add-mask::' + token)
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                      handle.write('HF_TOKEN=' + token + '\n')
                  print(f'HF_AUTH_SELECTED={label}:isPro={bool(info.get("isPro"))}')
                  break
          else:
              raise SystemExit('NO_G_ACE_HF_TOKEN_AVAILABLE')
          PY
      - name: Repair config collision, deploy existing Space, and run live E2E
        id: repair
        shell: bash
        run: |
          set -o pipefail
          pip install -r requirements-dev.txt --quiet
          pip install 'cryptography>=45,<47' 'httpx>=0.28,<1' --quiet
          python -m py_compile scripts/provision_hf_public.py public_app.py
          python scripts/provision_hf_public.py 2>&1 | tee /tmp/hf-space-repair.log
      - name: Persist focused repair evidence and remove one-time workflow
        if: always()
        shell: bash
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          log_path = Path('/tmp/hf-space-repair.log')
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          url_match = re.search(r'HF_PUBLIC_CUSTOMER_AI_URL=(https://\S+)', log)
          removed_wrong_variable = re.findall(r'HF_SPACE_CONFIG_REMOVED_WRONG_VARIABLE=([^\s]+)', log)
          removed_wrong_secret = re.findall(r'HF_SPACE_CONFIG_REMOVED_WRONG_SECRET=([^\s]+)', log)
          payload = {
              'status': os.environ.get('REPAIR_OUTCOME', 'unknown'),
              'target_space': 'G-ACE/astera-customerAI',
              'new_space_created': 'HF_PUBLIC_SPACE_CREATED=true' in log,
              'config_collision_repaired': bool(removed_wrong_variable or removed_wrong_secret) or 'HF_SPACE_CONFIG_TYPE_COLLISIONS=none' in log,
              'removed_wrong_variables': removed_wrong_variable,
              'removed_wrong_secrets': removed_wrong_secret,
              'ready': 'HF_CUSTOMER_AI_READY=true' in log,
              'space_public': 'HF_CUSTOMER_AI_SPACE_PUBLIC=true' in log,
              'live_e2e': 'HF_PUBLIC_CUSTOMER_AI_E2E_OK' in log,
              'public_url': url_match.group(1) if url_match else '',
              'source_sha': os.environ.get('GITHUB_SHA', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'log_tail': log[-4000:],
          }
          Path('deployment-evidence/hf-space-repair-latest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-evidence/hf-space-repair-latest.json
          git rm .github/workflows/repair-existing-hf-space.yml
          git commit -m 'fix: record existing Customer AI Space repair evidence'
          git push origin HEAD:main
