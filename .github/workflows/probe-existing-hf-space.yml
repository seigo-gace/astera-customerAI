name: probe-existing-hf-space

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-existing-hf-space.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      TARGET_SPACE: G-ACE/astera-customerAI
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Probe current runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          pip install 'huggingface_hub>=1.24.0' 'httpx>=0.28,<1' --quiet
          python - <<'PY'
          import json, os
          from pathlib import Path
          import httpx
          from huggingface_hub import HfApi
          selected = None
          for label, token in [('HF_TOKEN', os.environ.get('HF_TOKEN_PRIMARY','').strip()), ('HF_KEY', os.environ.get('HF_TOKEN_FALLBACK','').strip())]:
              if not token: continue
              try: who = HfApi(token=token).whoami()
              except Exception: continue
              if str(who.get('name') or '') == 'G-ACE': selected=(label,token); break
          if not selected: raise SystemExit('NO_G_ACE_HF_TOKEN_AVAILABLE')
          label, token = selected
          print('::add-mask::' + token)
          api=HfApi(token=token)
          target=os.environ['TARGET_SPACE']
          info=api.space_info(target, expand=['subdomain','sha','private','runtime'])
          variables=set(api.get_space_variables(target).keys())
          secrets=set(api.get_space_secrets(target).keys())
          collisions=sorted(variables & secrets)
          runtime=info.runtime
          stage=str(getattr(runtime,'stage','') or '')
          raw=getattr(runtime,'raw',{}) or {}
          subdomain=str(info.subdomain or '')
          url=f'https://{subdomain}.hf.space' if subdomain else ''
          public_health=0; auth_ready=0; public_respond=0; has_answer=False; detail=''
          try:
              r=httpx.get(url+'/healthz',timeout=20,follow_redirects=True); public_health=r.status_code
          except Exception as e: detail=f'health:{type(e).__name__}:{e}'
          try:
              r=httpx.get(url+'/readyz',headers={'authorization':f'Bearer {token}'},timeout=20,follow_redirects=True); auth_ready=r.status_code; detail=(r.text[:800] if r.status_code!=200 else detail)
          except Exception as e: detail=f'ready:{type(e).__name__}:{e}'
          payload={
              'target_space':target,'runtime_stage':stage,'runtime_error':str(raw.get('errorMessage') or ''),
              'space_private':bool(info.private),'space_sha':str(info.sha or ''),'space_url':url,
              'config_collisions':collisions,'public_healthz_status':public_health,'authenticated_readyz_status':auth_ready,
              'public_respond_status':public_respond,'respond_has_answer':has_answer,'detail':detail,
              'run_id':os.environ.get('GITHUB_RUN_ID',''),'source_sha':os.environ.get('GITHUB_SHA','')}
          Path('deployment-evidence').mkdir(exist_ok=True)
          Path('deployment-evidence/hf-space-probe-latest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('HF_SPACE_PROBE='+json.dumps(payload,ensure_ascii=False))
          PY
      - name: Persist probe and remove one-time workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -f deployment-evidence/hf-space-probe-latest.json ]; then git add deployment-evidence/hf-space-probe-latest.json; fi
          git rm .github/workflows/probe-existing-hf-space.yml
          git commit -m 'test: record existing Customer AI Space probe'
          git push origin HEAD:main
