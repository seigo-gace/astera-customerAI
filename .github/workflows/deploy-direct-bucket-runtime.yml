name: customer-ai-direct-bucket-runtime-deploy

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: github.actor == 'seigo-gace' && github.event.issue.title == '[deploy-direct-bucket] customer-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      HF_SPACE_ID: G-ACE/astera-customerAI
      HF_SPACE_URL: https://g-ace-astera-customerai.hf.space
      CUSTOMER_AI_KB_BUCKET_ID: G-ACE/astera-customerai-kb
      CUSTOMER_AI_KB_BUILD_ID: kb-20260814T042741+0900
      CUSTOMER_AI_KB_ACTIVE_POINTER: active.json
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install deploy tooling
        run: python -m pip install --quiet --upgrade 'huggingface_hub>=1.24,<2' 'httpx>=0.28,<1'

      - name: Select G-ACE HF token
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          selected=None
          for label,key in (("HF_TOKEN","HF_TOKEN_PRIMARY"),("HF_KEY","HF_TOKEN_FALLBACK")):
              token=os.environ.get(key,"").strip()
              if not token:
                  continue
              try:
                  who=HfApi(token=token).whoami()
              except Exception:
                  continue
              if str(who.get('name') or '')=='G-ACE':
                  selected=(label,token)
                  break
          if selected is None:
              raise SystemExit('no_gace_hf_token')
          label,token=selected
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('HF_TOKEN='+token+'\n')
              f.write('CUSTOMER_AI_RUNTIME_HF_TOKEN='+token+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('auth_ok=1\n')
          print('HF_AUTH_SELECTED='+label)
          PY

      - name: Re-run local free runtime gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --exclude-dir='__pycache__' --exclude='*.pyc' -nE 'router\.huggingface\.co|InferenceClient|InferenceEndpoint' app.py runtime config Dockerfile scripts/start_local_cpu.sh; then
            echo 'paid_inference_route_detected' >&2
            exit 1
          fi
          python -m compileall -q app.py runtime scripts/deploy_hf_direct.py
          echo 'gate_ok=1' >> "$GITHUB_OUTPUT"
          echo 'FREE_LOCAL_GATE=passed TOPOLOGY=4B+4B+8B'

      - name: Deploy verified main to HF CPU Basic
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/deploy_hf_direct.py \
            --repo-root . \
            --space-id "$HF_SPACE_ID" \
            --space-url "$HF_SPACE_URL" \
            --origin https://staging.asterav8.jp \
            --wait-timeout 3000 \
            --http-timeout 900 \
            2>&1 | tee /tmp/deploy.log
          echo 'deploy_ok=1' >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        shell: bash
        env:
          AUTH_OK: ${{ steps.auth.outputs.auth_ok }}
          GATE_OK: ${{ steps.gate.outputs.gate_ok }}
          DEPLOY_OK: ${{ steps.deploy.outputs.deploy_ok }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' >/tmp/report.txt
          import os
          from pathlib import Path
          print('DIRECT_BUCKET_DEPLOY_STATUS='+os.environ.get('JOB_STATUS',''))
          print('AUTH_OK='+os.environ.get('AUTH_OK','0'))
          print('FREE_LOCAL_GATE_OK='+os.environ.get('GATE_OK','0'))
          print('DEPLOY_OK='+os.environ.get('DEPLOY_OK','0'))
          print('TOPOLOGY=4B+4B+8B')
          print('INFERENCE_PROVIDER=disabled')
          print('KB_BUCKET=G-ACE/astera-customerai-kb')
          p=Path('/tmp/deploy.log')
          if p.exists():
              rows=p.read_text(encoding='utf-8',errors='replace').strip().splitlines()
              print('--- DEPLOY TAIL ---')
              print('\n'.join(rows[-80:])[-7000:])
          PY
          python - <<'PY' >/tmp/result.json
          import json
          body=open('/tmp/report.txt',encoding='utf-8').read()
          print(json.dumps({'body':'```\n'+body+'\n```'}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/result.json >/dev/null
