name: customer-ai-selfhosted-probe

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.actor == 'seigo-gace' && github.event.issue.title == '[selfhosted-probe] customer-ai'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Prove self-hosted runner execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'CUSTOMER_AI_SELFHOSTED_PROBE_OK=1'
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          body=$(printf 'CUSTOMER_AI_SELFHOSTED_PROBE_OK=1\nRUNNER_NAME=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s' "${RUNNER_NAME:-unknown}" "${RUNNER_OS:-unknown}" "${RUNNER_ARCH:-unknown}")
          python3 - "$body" <<'PY' > /tmp/comment.json
import json, sys
print(json.dumps({"body": sys.argv[1]}))
PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/comment.json
