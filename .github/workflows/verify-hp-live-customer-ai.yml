name: verify-hp-live-customer-ai

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-hp-live-customer-ai.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify live HP assets and Customer AI response
        shell: bash
        run: |
          set -euo pipefail
          pip install 'httpx>=0.28,<1' --quiet
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import httpx

          hp='https://asterav8.jp'
          endpoint='https://g-ace-astera-customerai.hf.space'
          stamp=str(int(time.time()))
          result={'hp':hp,'endpoint':endpoint,'page_status':0,'script_status':0,'client_status':0,'live_asset_has_endpoint':False,'respond_status':0,'respond_has_answer':False,'answer_preview':'','run_id':os.environ.get('GITHUB_RUN_ID',''),'source_sha':os.environ.get('GITHUB_SHA','')}
          with httpx.Client(timeout=45, follow_redirects=True, headers={'user-agent':'Astera-HP-E2E/1.0'}) as client:
              page=client.get(hp+'/ja/?_e2e='+stamp); result['page_status']=page.status_code
              script=client.get(hp+'/script.js?_e2e='+stamp); result['script_status']=script.status_code
              ai=client.get(hp+'/scripts/ai-hf-chat.js?_e2e='+stamp); result['client_status']=ai.status_code
              result['live_asset_has_endpoint']=endpoint in ai.text
              suffix=stamp
              payload={'session_id':'session_hp_e2e_'+suffix,'message_id':'message_hp_e2e_'+suffix,'message':'料金を教えて','locale':'ja-JP','source':'astera-hp','response_mode':'billing','mode_source':'selected','current_path':'/ja/'}
              response=client.post(endpoint+'/respond',json=payload,headers={'origin':hp,'content-type':'application/json'}); result['respond_status']=response.status_code
              if response.status_code==200:
                  body=response.json(); answer=str(body.get('answer') or body.get('clarification') or '').strip(); result['respond_has_answer']=bool(answer); result['answer_preview']=answer[:180]
                  if answer:
                      client.delete(endpoint+'/sessions/'+payload['session_id'],headers={'origin':hp})
          Path('deployment-evidence').mkdir(exist_ok=True)
          Path('deployment-evidence/hp-live-customer-ai-e2e.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('HP_LIVE_CUSTOMER_AI_E2E='+json.dumps(result,ensure_ascii=False))
          if not (result['page_status']==200 and result['script_status']==200 and result['client_status']==200 and result['live_asset_has_endpoint'] and result['respond_status']==200 and result['respond_has_answer']):
              raise SystemExit('HP_LIVE_CUSTOMER_AI_E2E_FAILED')
          PY
      - name: Persist E2E and remove one-time workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -f deployment-evidence/hp-live-customer-ai-e2e.json ]; then git add deployment-evidence/hp-live-customer-ai-e2e.json; fi
          git rm .github/workflows/verify-hp-live-customer-ai.yml
          git commit -m 'test: record live HP Customer AI E2E evidence'
          git push origin HEAD:main
