name: hf-kb-storage-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      HF_KB_BUCKET_ID: G-ACE/astera-customerai-kb
    steps:
      - name: Install Hugging Face client
        run: python -m pip install --quiet --upgrade 'huggingface_hub>=1.24,<2'

      - name: Verify private Storage Bucket write
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, uuid
          from huggingface_hub import HfApi, HfFileSystem, batch_bucket_files, bucket_info, create_bucket
          candidates=[('HF_TOKEN',os.environ.get('HF_TOKEN_PRIMARY','').strip()),('HF_KEY',os.environ.get('HF_TOKEN_FALLBACK','').strip())]
          selected=None
          for label, token in candidates:
              if not token: continue
              try:
                  who=HfApi(token=token).whoami()
              except Exception:
                  continue
              if str(who.get('name') or '') == 'G-ACE':
                  selected=(label,token)
                  access=(who.get('auth') or {}).get('accessToken') or {}
                  if str(access.get('role') or '').lower() == 'write':
                      break
          if selected is None:
              raise SystemExit('NO_G_ACE_HF_TOKEN_AVAILABLE')
          label, token=selected
          print('::add-mask::'+token)
          bucket_id=os.environ['HF_KB_BUCKET_ID']
          create_bucket(bucket_id, private=True, exist_ok=True, token=token)
          info=bucket_info(bucket_id, token=token)
          if not info.private:
              raise SystemExit('HF_BUCKET_NOT_PRIVATE')
          fs=HfFileSystem(token=token)
          probe_path=f'.preflight/{uuid.uuid4().hex}.json'
          probe_uri=f'hf://buckets/{bucket_id}/{probe_path}'
          payload=(json.dumps({'probe':'astera-customerai-kb-storage-write','ok':True})+'\n').encode()
          batch_bucket_files(bucket_id, add=[(payload,probe_path)], token=token)
          if not fs.exists(probe_uri):
              raise SystemExit('HF_BUCKET_WRITE_READBACK_MISSING')
          with fs.open(probe_uri,'rb') as handle:
              if handle.read()!=payload:
                  raise SystemExit('HF_BUCKET_WRITE_READBACK_MISMATCH')
          try: fs.rm(probe_uri)
          except Exception: pass
          print('HF_IDENTITY=G-ACE')
          print('HF_AUTH_SELECTED='+label)
          print('HF_BUCKET_PRIVATE=true')
          print('HF_BUCKET_WRITE=true')
          PY
