name: hf-kb-storage-bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hf-kb-storage-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      HF_KB_BUCKET_ID: G-ACE/astera-customerai-kb
      NOTION_KB_PAGE_ID: 3aecdcf1-28e4-81c8-82e3-d12163ba9de2
    steps:
      - name: Install clients
        run: python -m pip install --quiet --upgrade 'huggingface_hub>=1.24,<2' 'httpx>=0.28,<1'

      - name: Verify HF private Storage Bucket write and Notion private read
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import uuid
          import httpx
          from huggingface_hub import HfApi, HfFileSystem, batch_bucket_files, bucket_info, create_bucket

          candidates = [
              ("HF_TOKEN", os.environ.get("HF_TOKEN_PRIMARY", "").strip()),
              ("HF_KEY", os.environ.get("HF_TOKEN_FALLBACK", "").strip()),
          ]
          selected = None
          diagnostics = []
          for label, token in candidates:
              if not token:
                  diagnostics.append(f"{label}:missing")
                  continue
              try:
                  who = HfApi(token=token).whoami()
                  name = str(who.get("name") or "")
                  diagnostics.append(f"{label}:identity={name or 'unknown'}")
                  if name == "G-ACE":
                      selected = (label, token)
                      try:
                          access = (who.get("auth") or {}).get("accessToken") or {}
                          if str(access.get("role") or "").lower() == "write":
                              break
                      except Exception:
                          pass
              except Exception as exc:
                  diagnostics.append(f"{label}:auth_error={type(exc).__name__}")

          for line in diagnostics:
              print("HF_AUTH_DIAGNOSTIC=" + line)
          if selected is None:
              raise SystemExit("NO_G_ACE_HF_TOKEN_AVAILABLE")

          label, token = selected
          print("::add-mask::" + token)
          bucket_id = os.environ["HF_KB_BUCKET_ID"]
          bucket = create_bucket(bucket_id, private=True, exist_ok=True, token=token)
          info = bucket_info(bucket_id, token=token)
          if not info.private:
              raise SystemExit("HF_BUCKET_NOT_PRIVATE")

          fs = HfFileSystem(token=token)
          probe_path = f".preflight/{uuid.uuid4().hex}.json"
          probe_uri = f"hf://buckets/{bucket_id}/{probe_path}"
          payload = (json.dumps({"probe": "astera-customerai-kb-storage-write", "ok": True}, sort_keys=True) + "\n").encode("utf-8")
          batch_bucket_files(bucket_id, add=[(payload, probe_path)], token=token)
          if not fs.exists(probe_uri):
              raise SystemExit("HF_BUCKET_WRITE_READBACK_MISSING")
          with fs.open(probe_uri, "rb") as handle:
              if handle.read() != payload:
                  raise SystemExit("HF_BUCKET_WRITE_READBACK_MISMATCH")
          try:
              fs.rm(probe_uri)
          except Exception as exc:
              print("HF_PROBE_CLEANUP=" + type(exc).__name__)
          print("HF_IDENTITY=G-ACE")
          print("HF_AUTH_SELECTED=" + label)
          print("HF_BUCKET_PRIVATE=true")
          print("HF_BUCKET_WRITE=true")

          notion_token = os.environ.get("NOTION_TOKEN", "").strip()
          if not notion_token:
              raise SystemExit("NOTION_TOKEN_MISSING")
          print("::add-mask::" + notion_token)
          page_id = os.environ["NOTION_KB_PAGE_ID"]
          response = httpx.get(
              f"https://api.notion.com/v1/pages/{page_id}",
              headers={
                  "Authorization": f"Bearer {notion_token}",
                  "Notion-Version": "2022-06-28",
              },
              timeout=30.0,
          )
          if response.status_code != 200:
              raise SystemExit(f"NOTION_PRIVATE_PAGE_READ_FAILED={response.status_code}")
          body = response.json()
          if str(body.get("id") or "").replace("-", "") != page_id.replace("-", ""):
              raise SystemExit("NOTION_PRIVATE_PAGE_ID_MISMATCH")
          print("NOTION_AUTH=true")
          print("NOTION_PRIVATE_KB_PAGE_READ=true")
          PY
