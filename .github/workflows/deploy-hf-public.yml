name: deploy-public-hf-customer-ai

on:
  push:
    branches: [main]
    paths:
      - '.deploy/customer-ai-public'
      - 'public_app.py'
      - 'scripts/provision_hf_public.py'
      - 'tests/test_public_hf_api.py'
      - '.github/workflows/deploy-hf-public.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-public-hf-customer-ai
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      HF_PUBLIC_SPACE_ID: G-ACE/astera-customerAI
      CUSTOMER_AI_MODEL_ID: Qwen/Qwen3-0.6B
      CUSTOMER_AI_MODEL_REVISION: c1899de289a04d12100db370d81485cdf75e47ca
      CUSTOMER_AI_ENABLE_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify deploy source
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN missing' >&2; exit 11; }
          python -m pip install --upgrade pip --quiet
          pip install 'huggingface_hub>=1.24.0' 'cryptography>=45,<47' 'httpx>=0.28,<1' --quiet
          python -m py_compile public_app.py scripts/provision_hf_public.py
          grep -Fq 'runtime.bundle.enc' scripts/provision_hf_public.py
          grep -Fq 'Fernet' scripts/provision_hf_public.py
          grep -Fq 'EXISTING_CUSTOMER_AI_SPACE_MUST_START_PRIVATE' scripts/provision_hf_public.py
          grep -Fq 'HF_PUBLIC_SPACE_SOURCE_SANITIZED=true' scripts/provision_hf_public.py
          ! grep -Eqi 'cloudflare|turnstile|api\.asterav8\.jp' public_app.py scripts/provision_hf_public.py
      - name: Persist preflight run evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('deployment-evidence/public-hf-progress.json').write_text(json.dumps({
              'stage': 'preflight_complete',
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'architecture': 'public HP -> existing HF public API boundary; encrypted runtime bundle deployed from private GitHub source',
              'cloudflare_customer_ai': False,
              'space': 'G-ACE/astera-customerAI',
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-evidence/public-hf-progress.json
          git commit -m "chore: record Customer AI deploy preflight" || true
          git push origin HEAD:main
      - name: Deploy encrypted runtime bundle and run live E2E
        id: live
        shell: bash
        run: |
          set -o pipefail
          python scripts/provision_hf_public.py 2>&1 | tee /tmp/customer-ai-public-deploy.log
      - name: Persist deployment evidence
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'status': os.environ.get('JOB_STATUS', 'unknown'),
              'preflight': os.environ.get('PREFLIGHT_OUTCOME', 'unknown'),
              'live_e2e': os.environ.get('LIVE_OUTCOME', 'unknown'),
              'architecture': 'public HP -> existing HF public API boundary; encrypted runtime bundle deployed from private GitHub source',
              'cloudflare_customer_ai': False,
              'public_space': 'G-ACE/astera-customerAI',
              'private_source_repo': 'seigo-gace/astera-customerAI',
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }
          Path('deployment-evidence/public-hf-latest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git add deployment-evidence/public-hf-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record public Customer AI live evidence"
          git push origin HEAD:main
