name: customer-ai-uploaded-private-kb-deploy

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: github.actor == 'seigo-gace' && github.event.issue.title == '[kb-uploaded-deploy] customer-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_FALLBACK: ${{ secrets.HF_KEY }}
      HF_BUCKET_ID: G-ACE/astera-customerai-kb
      HF_SPACE_ID: G-ACE/astera-customerAI
      CUSTOMER_AI_KB_BUCKET_ID: G-ACE/astera-customerai-kb
      CUSTOMER_AI_KB_BUILD_ID: kb-20260814T042741+0900
      CUSTOMER_AI_KB_MOUNT_PATH: /data/customer-ai
      CUSTOMER_AI_KB_ACTIVE_POINTER: active.json
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install HF tooling
        run: python -m pip install --quiet --upgrade 'huggingface_hub>=1.24,<2' 'httpx>=0.27,<1'

      - name: Select G-ACE HF token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          selected=None
          for label,key in (("HF_TOKEN","HF_TOKEN_PRIMARY"),("HF_KEY","HF_TOKEN_FALLBACK")):
              token=os.environ.get(key,"").strip()
              if not token:
                  continue
              try:
                  who=HfApi(token=token).whoami()
              except Exception:
                  continue
              if str(who.get("name") or "") == "G-ACE":
                  selected=(label,token)
          if selected is None:
              raise SystemExit("no_gace_hf_token")
          label,token=selected
          print("::add-mask::"+token)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("HF_TOKEN="+token+"\n")
          print("HF_AUTH_SELECTED="+label)
          PY

      - name: Validate uploaded private KB
        id: kb
        shell: bash
        run: |
          set -euo pipefail
          { python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from huggingface_hub import HfFileSystem, bucket_info, list_bucket_tree

          bucket_id=os.environ['HF_BUCKET_ID']
          build_id=os.environ['CUSTOMER_AI_KB_BUILD_ID']
          token=os.environ['HF_TOKEN']
          info=bucket_info(bucket_id,token=token)
          if not info.private:
              raise SystemExit('kb_bucket_not_private')
          fs=HfFileSystem(token=token)
          base=f'hf://buckets/{bucket_id}'
          paths=[str(x.path) for x in list_bucket_tree(bucket_id,token=token,recursive=True)]
          print('BUCKET_PRIVATE=1')
          print('BUCKET_FILE_COUNT='+str(info.total_files))
          for p in paths:
              print('BUCKET_PATH='+p)

          def readb(path):
              with fs.open(f'{base}/{path}','rb') as f:
                  return f.read()
          active=json.loads(readb('active.json').decode('utf-8'))
          if str(active.get('build_id') or '') != build_id:
              raise SystemExit(f"active_build_mismatch={active.get('build_id')}")
          release_root=f'releases/{build_id}'
          expected_active={
              'canonical_path':f'{release_root}/canonical_stable.jsonl',
              'current_facts_path':f'{release_root}/current_facts.jsonl',
              'manifest_path':f'{release_root}/manifest.json',
          }
          for key,value in expected_active.items():
              if active.get(key) != value:
                  raise SystemExit(f'active_path_mismatch={key}:{active.get(key)}')

          manifest=json.loads(readb(f'{release_root}/manifest.json').decode('utf-8'))
          if str(manifest.get('build_id') or '') != build_id:
              raise SystemExit('manifest_build_mismatch')
          for item in manifest.get('files',[]):
              path=f"{release_root}/{item['path']}"
              raw=readb(path)
              if len(raw) != int(item['bytes']):
                  raise SystemExit(f'remote_size_mismatch={path}')
              if hashlib.sha256(raw).hexdigest() != str(item['sha256']):
                  raise SystemExit(f'remote_sha_mismatch={path}')

          validation=json.loads(readb(f'{release_root}/validation.json').decode('utf-8'))
          if validation.get('passed') is not True:
              raise SystemExit('validation_not_passed')
          counts=validation.get('counts') or {}
          expected={'canonical_stable':493,'current_facts':31,'retrieval_documents':524}
          for key,value in expected.items():
              if int(counts.get(key,-1)) != value:
                  raise SystemExit(f'count_mismatch={key}:{counts.get(key)}')

          evidence={
              'bucket_id':bucket_id,'private':True,'build_id':build_id,
              'bucket_files':int(info.total_files),'canonical':493,
              'current_facts':31,'retrieval_documents':524,'active':'active.json',
              'manifest_sha256':hashlib.sha256(readb(f'{release_root}/manifest.json')).hexdigest(),
          }
          Path('/tmp/kb-evidence.json').write_text(json.dumps(evidence),encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False))
          PY
          } 2>&1 | tee /tmp/kb.log
          echo 'kb_ok=1' >> "$GITHUB_OUTPUT"

      - name: Deploy Customer AI with uploaded KB
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/deploy_hf_direct.py --repo-root . 2>&1 | tee /tmp/deploy.log
          echo 'deploy_ok=1' >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        shell: bash
        env:
          KB_OK: ${{ steps.kb.outputs.kb_ok }}
          DEPLOY_OK: ${{ steps.deploy.outputs.deploy_ok }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/report.txt
          import json,os
          lines=[f"UPLOADED_KB_DEPLOY_STATUS={os.environ.get('JOB_STATUS','')}",
                 f"KB_OK={os.environ.get('KB_OK','0')}",
                 f"DEPLOY_OK={os.environ.get('DEPLOY_OK','0')}"]
          try:
              d=json.load(open('/tmp/kb-evidence.json',encoding='utf-8'))
              lines.append('KB='+json.dumps(d,ensure_ascii=False,separators=(',',':')))
          except Exception: pass
          for path,label in [('/tmp/kb.log','KB_ERROR'),('/tmp/deploy.log','DEPLOY_ERROR')]:
              try:
                  text=open(path,encoding='utf-8',errors='replace').read().strip().splitlines()
                  if text:
                      lines.append(label+'='+text[-1][:1200])
              except Exception: pass
          print('\n'.join(lines))
          PY
          python - <<'PY' >/tmp/result.json
          import json
          print(json.dumps({'body':open('/tmp/report.txt',encoding='utf-8').read()}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/result.json >/dev/null
