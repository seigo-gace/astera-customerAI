name: customer-ai-free-local-runtime-verify

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.actor == 'seigo-gace' && github.event.issue.title == '[free-local-runtime-verify] customer-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      CUSTOMER_AI_KB_BUILD_ID: kb-20260814T042741+0900
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet pytest==9.0.2 pytest-asyncio 'ruff>=0.12,<1'
      - name: Compile
        run: python -m compileall -q app.py runtime scripts/deploy_hf_direct.py
      - name: Guard against paid inference routes
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'router\.huggingface\.co|InferenceClient|InferenceEndpoint' app.py runtime config Dockerfile scripts/start_local_cpu.sh; then
            echo 'paid_inference_route_detected' >&2
            exit 1
          fi
          grep -q 'http://127.0.0.1:8081/v1/chat/completions' runtime/hf_client.py
          grep -q 'http://127.0.0.1:8082/v1/chat/completions' runtime/hf_client.py
          grep -q 'http://127.0.0.1:8083/v1/chat/completions' runtime/hf_client.py
      - name: Verify required topology and pinned model hashes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'HF_MODEL_4B = "llm-jp/llm-jp-3-3.7b-instruct3"' runtime/hf_client.py
          grep -q 'HF_MODEL_8B = "llm-jp/llm-jp-4-8b-instruct"' runtime/hf_client.py
          test "$(grep -c 'llm-jp/llm-jp-3-3.7b-instruct3' scripts/start_local_cpu.sh)" -ge 2
          grep -q 'a4a09d2141717a01b44e7a8dbdb28da8c01e9078c8051367cd6a20f7008ef5a8' Dockerfile
          grep -q 'b6a61b9c8d4e7cb1ae543d8fcf472c9fb9abfc5d48af17f5017ce89c2dc0bd56' Dockerfile
      - name: Unit tests
        run: pytest -q
      - name: Deploy payload dry-run
        run: python scripts/deploy_hf_direct.py --repo-root . --dry-run >/tmp/dry-run.json
      - name: Report success
        if: success()
        shell: bash
        run: |
          body='FREE_LOCAL_RUNTIME_VERIFY=success\nTOPOLOGY=4B+4B+8B\nINFERENCE_PROVIDER=disabled\nKB_BUCKET=G-ACE/astera-customerai-kb\nDRY_RUN=passed'
          python - "$body" <<'PY' >/tmp/result.json
          import json, sys
          print(json.dumps({'body': sys.argv[1]}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/result.json >/dev/null
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          body='FREE_LOCAL_RUNTIME_VERIFY=failure'
          python - "$body" <<'PY' >/tmp/result.json
          import json, sys
          print(json.dumps({'body': sys.argv[1]}))
          PY
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @/tmp/result.json >/dev/null || true
